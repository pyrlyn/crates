[package]
name = "path-gates"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Map changed paths to named gates by glob rules from a TOML config"
license = "MIT"
repository = "https://github.com/pyrlyn/crates"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
