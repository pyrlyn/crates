[package]
name = "sqlite-change-feed"
version = "0.1.1"
edition = "2024"
# cox's MSRV, the lowest of its consumers (cox 1.98, Mailune 1.99).
rust-version = "1.98"
description = "Change feed for a SQLite database shared between processes: PRAGMA data_version polled through Diesel, seeing other connections' commits and not your own"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["sqlite", "diesel", "change-feed", "data-version"]
categories = ["database"]
# The member's plan and agent files are repository bookkeeping, not part of the published crate.
include = ["/src", "/tests", "/README.md"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

# Versions are the ones cox and Mailune lock. No default features and no
# libsqlite3-sys choice: the application picks bundled SQLite or SQLCipher.
[dependencies]
diesel = { version = "2.3.13", default-features = false, features = ["sqlite"] }
thiserror = "2.0.21"

[dev-dependencies]
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
tempfile = "3.27.0"
