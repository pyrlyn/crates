[package]
name = "cargo-profile-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Check that Cargo.toml build profiles match a shared profile template, Cargo inheritance resolved; one ADD/REMOVE line per difference"
license = "MIT"
repository = "https://github.com/pyrlyn/crates"
keywords = ["cargo", "profile", "lint", "cargo-subcommand", "ci"]
categories = ["development-tools::cargo-plugins"]
include = ["src/**", "templates/**", "Cargo.toml", "README.md"]

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "cargo-profile-check"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
