[workspace]
members = ["a", "b"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.ci]
inherits = "dev"
debug = false
incremental = false
