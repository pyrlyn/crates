[package]
name = "match"
version = "0.1.0"
edition = "2021"

# Equivalent spellings of the bundled template; panic/incremental come from Cargo defaults.
[profile.dev]
opt-level = "0"
debug = "line-tables-only"
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[profile.ci]
inherits = "dev"
debug = "none"
incremental = false
