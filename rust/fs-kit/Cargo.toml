[package]
name = "fs-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "One entry point for file and directory work: path identity without Windows UNC prefixes, atomic writes, tree size, copy and removal, sibling backups"
license.workspace = true
repository = "https://github.com/pyrlyn/crates"
keywords = ["filesystem", "atomic", "path", "canonicalize", "copy"]
categories = ["filesystem"]

[lints.rust]
unsafe_code = "forbid"

[features]
# Copy-on-write clones for `tree::clone_tree`; off by default so the default build stays std
# plus dunce.
clone = ["dep:reflink-copy"]

[dependencies]
dunce = "1"
reflink-copy = { version = "0.1.30", optional = true }

[dev-dependencies]
tempfile = "3"
