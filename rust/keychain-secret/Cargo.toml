[package]
name = "keychain-secret"
version = "0.1.1"
edition = "2024"
# cox's and runa's MSRV, the lowest of its consumers (cox and runa 1.98, aulo and Mailune 1.99).
rust-version = "1.98"
description = "Application secrets from an environment variable or the OS keychain, never a config file: a redacted Secret type, an in-memory store for tests and a guard against tests reaching the real keychain"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["keychain", "keyring", "secrets", "credentials", "api-key"]
categories = ["authentication", "config"]
# The member's plan and agent files are repository bookkeeping, not part of the published crate.
include = ["/src", "/README.md"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

# Versions are the ones cox, runa and aulo lock, so adopting the crate moves no lock file.
[dependencies]
keyring = "4.2.0"
thiserror = "2.0.21"
toml = "0.9.12"
