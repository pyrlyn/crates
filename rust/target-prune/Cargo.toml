[package]
name = "target-prune"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Keep the last N cargo build runs in target/ (plus their dependencies), drop the rest; optional per-dir and total size budgets"
license.workspace = true
repository = "https://github.com/pyrlyn/crates"
keywords = ["cargo", "target", "prune", "cleanup", "disk"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
exclude = ["bench/out-*"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
