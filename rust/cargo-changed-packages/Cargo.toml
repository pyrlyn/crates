[package]
name = "cargo-changed-packages"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Workspace packages a set of changed paths affects, including reverse dependencies"
license = "MIT"
repository = "https://github.com/pyrlyn/crates"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# determinator 0.12 is built against guppy 0.17; its PackageGraph type must be the same one.
determinator = "0.12.0"
guppy = "0.17.26"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
