[package]
name = "abi-drift"
version = "0.1.1"
edition = "2021"
# ketch's MSRV, the lowest of its consumers (ketch 1.86, scull 1.99); similar 3.2 needs 1.85.
rust-version = "1.86"
description = "Drift tests for generated bindings: regenerate a cbindgen header or csbindgen C# file, diff it against the committed copy, rewrite it under a bless variable"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["cbindgen", "csbindgen", "ffi", "bindings", "testing"]
categories = ["development-tools::testing", "development-tools::ffi"]
# The member's plan and agent files are repository bookkeeping, not part of the published crate.
include = ["/src", "/tests", "/README.md"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[features]
default = ["cbindgen", "csbindgen"]
# Each generator is optional, so a crate with only a C header does not build csbindgen.
cbindgen = ["dep:cbindgen"]
csbindgen = ["dep:csbindgen"]

# Versions are the ones scull and ketch lock; similar is change-preview's.
[dependencies]
# Library API only, without cbindgen's CLI.
cbindgen = { version = "0.29.3", default-features = false, optional = true }
csbindgen = { version = "1.9.8", optional = true }
similar = "3.2"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "drift"
required-features = ["cbindgen", "csbindgen"]
