[package]
name = "telemetry-setup"
version = "0.1.0"
edition = "2024"
# The lowest MSRV of its candidate consumers (cox 1.98, aulo and Mailune 1.99).
rust-version = "1.98"
description = "tracing setup for applications: a rotating JSON log, a human stderr log and optional OTLP traces, with secrets masked before any line or span leaves the process"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["tracing", "logging", "redaction", "opentelemetry"]
categories = ["development-tools::debugging"]
# The member's plan and agent files are repository bookkeeping, not part of the published crate.
include = ["/src", "/tests", "/README.md"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[features]
# OTLP trace export is opt-in so the default build carries no HTTP client.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

# Versions are the ones aulo locks, so adopting the crate moves neither lock file.
[dependencies]
opentelemetry = { version = "0.33.0", optional = true }
opentelemetry-otlp = { version = "0.33.0", default-features = false, optional = true, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.0", optional = true, features = ["trace"] }
regex = "1.13.1"
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "registry", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
