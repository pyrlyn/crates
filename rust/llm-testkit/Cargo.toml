[package]
name = "llm-testkit"
version = "0.1.0"
edition = "2024"
# Same MSRV as published llm-http 0.1.0, the crate this re-exports.
rust-version = "1.98"
description = "Re-exports llm-http's cassette: record and replay HTTP bodies with secrets masked"
license = "GPL-3.0-or-later OR LicenseRef-Royalty-Free"
repository = "https://github.com/pyrlyn/crates"
keywords = ["llm", "testing", "http", "cassette", "redaction"]
categories = ["development-tools::testing"]
readme = "README.md"
exclude = ["AGENTS.md", "done.md", "ideas.md", "justfile", "plan.md", "roadmap.md", "todo.md", "toolchain.md"]

[dependencies]
# Version plus path, the same shape as the other published siblings. `cargo publish`
# rewrites the path to crates.io `llm-http` 0.1.0. A version-only dependency would
# download that crate beside this workspace's path package and make `-p llm-http`
# ambiguous. `test-util` exposes `llm_http::cassette`. The HTTP client and keyring
# are not used here.
llm-http = { path = "../llm-http", version = "0.1.0", default-features = false, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
