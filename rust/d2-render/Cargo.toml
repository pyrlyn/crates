[package]
name = "d2-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Render D2 diagrams to SVG/PNG in pure Rust (or through the optional d2 CLI backend), with diagnostics and freshness checks"
license = "MIT AND MPL-2.0"
repository = "https://github.com/pyrlyn/crates"
homepage = "https://github.com/pyrlyn/crates/tree/main/rust/d2-render"
documentation = "https://docs.rs/d2-render"
readme = "README.md"
keywords = ["d2", "d2lang", "diagram", "svg", "renderer"]
categories = ["visualization", "rendering", "graphics"]
# Sources, examples, tests (with their small fixtures) and both license texts.
# AGENTS.md is contributor tooling and stays out of the package.
include = [
    "/src/**/*.rs",
    "/examples/*.rs",
    "/tests/**/*.rs",
    "/tests/fixtures/*.d2",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-MPL-2.0",
]

[features]
default = ["native"]
# Pure-Rust renderer for a subset of D2 (SVG, no `d2` binary needed).
native = []
# Backend running the `d2` executable: the whole language, every format.
cli = []
# PNG output for the native backend via the pure-Rust `resvg` rasterizer.
png = ["native", "dep:resvg"]
# ratatui widget showing render status and diagnostics.
tui = ["dep:ratatui"]
# HTML helpers: inline SVG, data URIs, standalone pages.
web = []
# Debounced file watching with automatic re-rendering.
watch = ["dep:notify", "dep:notify-debouncer-mini"]
full = ["native", "cli", "png", "tui", "web", "watch"]

[dependencies]
sha2 = "0.10"
tempfile = "3"
ratatui = { version = "0.29", default-features = false, optional = true }
notify = { version = "8", optional = true }
notify-debouncer-mini = { version = "0.6", optional = true }
resvg = { version = "0.45", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "basic"
required-features = ["native"]

[[example]]
name = "cli"
required-features = ["cli"]

[[example]]
name = "native"
required-features = ["native"]

[[example]]
name = "png"
required-features = ["png"]

[[example]]
name = "tui_report"
required-features = ["tui", "native"]

[[example]]
name = "web_page"
required-features = ["web", "native"]

[[example]]
name = "watch"
required-features = ["watch", "native"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "env"
required-features = ["cli"]

[[test]]
name = "fake_cli"
required-features = ["cli"]

[[test]]
name = "native"
required-features = ["native"]

[[test]]
name = "png"
required-features = ["png"]

[[test]]
name = "tui"
required-features = ["tui"]

[[test]]
name = "web"
required-features = ["web"]

[[test]]
name = "watch"
required-features = ["watch"]

[package.metadata.docs.rs]
all-features = true
# `docsrs` turns on `doc_cfg`, so feature-gated items carry a feature badge.
rustdoc-args = ["--cfg", "docsrs"]
