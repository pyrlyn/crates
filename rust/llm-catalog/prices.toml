# Model pricing table (plan.md §1.4/T1.7).
# Prices in USD per million tokens (MTok).
# Cache pricing: cache_write happens to be 1.25x input_price for
# Anthropic's own SKUs; cache_read is an absolute USD/MTok rate, not a
# multiplier — see usage.rs PriceTable::cost.
# Verified on 2026-09-02 from https://platform.claude.com/docs/pricing
# Type-2 provider rows regenerated on 2026-09-25 from https://models.dev/api.json by
# `uv run --project scripts/vendor cox-vendor models` (scripts/vendor/src/
# cox_vendor/models.py) — re-run that command to refresh instead of
# hand-editing. ids match default.toml [providers.*].models exactly so
# every catalogued model prices its ledger row. OpenAI-compatible vendors
# bill no cache-write surcharge unless models.dev's `cost.cache_write` says
# otherwise; tiered context-overage pricing (gpt-5.5/5.6-sol, grok) is
# recorded at the base tier.

