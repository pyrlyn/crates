[package]
name = "sqlite-csr-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Code-symbol store in SQLite with a native reference/call graph in compact CSR segments: lock-free snapshot readers, delta writes with background merge, impact/callers/callees as table-valued functions, also as a loadable extension"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
readme = "README.md"
keywords = ["sqlite", "graph", "csr", "code-index", "extension"]
categories = ["database", "data-structures"]
# The member's agent files are repository bookkeeping.
include = ["/src", "/tests", "/README.md", "/docs"]

[lib]
# rlib for Rust hosts; cdylib is the SQLite loadable extension (`--no-default-features --features loadable`).
crate-type = ["rlib", "cdylib"]

[lints.rust]
# `unsafe` lives only in src/ffi.rs (module-level allow, a SAFETY note per block).
unsafe_code = "deny"
missing_debug_implementations = "warn"

[features]
default = ["bundled"]
# Statically link SQLite (libsqlite3-sys `bundled`). Off for the loadable extension: the host owns SQLite.
bundled = ["libsqlite3-sys/bundled"]
# Build the cdylib as a SQLite loadable extension (exports `sqlite3_extension_init`).
loadable = ["libsqlite3-sys/loadable_extension"]

# libsqlite3-sys directly, at the version the workspace (and diesel) already link: only one
# crate may link `sqlite3`, and hosts that use diesel get no second SQLite wrapper.
[dependencies]
libsqlite3-sys = "0.38.2"
arc-swap = "1.9"

[dev-dependencies]
tempfile = "3.27.0"
# Shows the auto-extension path a diesel host uses.
diesel = { version = "2.3.13", default-features = false, features = ["sqlite"] }
