[package]
name = "bless-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Check that a committed generated file matches what the code renders now, or rewrite it when blessed"
license = "MIT"
repository = "https://github.com/pyrlyn/crates"
# Consumed by path from sibling checkouts only; release-plz skips it.
publish = false

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3.27.0"
