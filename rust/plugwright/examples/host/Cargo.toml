[package]
name = "plugwright-host"
description = "Demo host for plugwright: builds, loads, calls and breaks plugins"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
plugwright = { workspace = true, features = ["wasmtime", "wasmi"] }
serde.workspace = true
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

# Performance tests with budgets: `cargo bench -p plugwright-host --bench perf`.
[[bench]]
name = "perf"
harness = false
