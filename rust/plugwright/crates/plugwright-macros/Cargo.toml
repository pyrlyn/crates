[package]
name = "plugwright-macros"
description = "Procedural macros for plugwright: #[plugin] for plugin authors, #[interface] for typed host calls"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }

[lints]
workspace = true
