[package]
name = "plugwright-wasm"
description = "Engine-agnostic Wasm layer of plugwright: three small engine traits and the shared plugin ABI glue"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["plugin", "wasm"]

[dependencies]
plugwright-abi.workspace = true
plugwright-core.workspace = true
semver.workspace = true
serde.workspace = true
# Content keys for compiled modules.
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
