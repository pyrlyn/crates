[package]
name = "plugwright-build"
description = "Builds plugin crates with cargo into a content-addressed cache; git sources pinned by SHA"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["plugin", "cargo", "cache"]

[dependencies]
plugwright-abi.workspace = true
# Finds the C compiler driver / link.exe the way build scripts do.
cc.workspace = true
# Finds a workspace package by name (`cargo plugwright lib|wasm|plugin`).
cargo_metadata.workspace = true
# Canonical paths without the Windows `\\?\` prefix, lexical cleanup for missing ones.
fs-kit.workspace = true
plugwright-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Reads plugin manifests for the cache key (no `cargo metadata` run).
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
