[package]
name = "plugwright"
description = "Build, cache, load, isolate and unload Rust plugins: native cdylib via libloading and Wasm via pluggable engines"
version = "0.1.0"
edition = "2024"
# wasmtime 49 needs 1.96; plugwright-abi/-sdk keep the lower workspace MSRV.
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["plugin", "dylib", "wasm", "libloading", "sandbox"]
categories = ["development-tools", "wasm"]

[features]
default = ["wasmtime", "wasmi"]
wasmtime = ["plugwright-loader/wasmtime"]
wasmi = ["plugwright-loader/wasmi"]

[dependencies]
plugwright-abi.workspace = true
plugwright-core.workspace = true
plugwright-sandbox.workspace = true
plugwright-trust.workspace = true
plugwright-build.workspace = true
plugwright-native.workspace = true
plugwright-isolate.workspace = true
plugwright-wasm.workspace = true
plugwright-macros.workspace = true
plugwright-loader = { workspace = true, features = ["wasm"] }
notify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
plugwright-trust = { workspace = true, features = ["sign"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true

[lints]
workspace = true
