[package]
name = "plugwright-sdk"
description = "Write plugwright plugins once, build them as native cdylib or Wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"

[features]
default = ["macros"]
# `#[plugin]` and the serde-based argument encoding it relies on.
macros = ["dep:plugwright-macros", "dep:serde", "dep:serde_json"]

[dependencies]
plugwright-abi.workspace = true
plugwright-macros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
