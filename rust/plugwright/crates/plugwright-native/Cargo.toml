[package]
name = "plugwright-native"
description = "In-process loader for plugwright native plugins (libloading) with unload verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["plugin", "dylib", "libloading"]

[dependencies]
plugwright-abi.workspace = true
plugwright-core.workspace = true
libloading.workspace = true
semver.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
