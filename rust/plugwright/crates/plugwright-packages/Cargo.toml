[package]
name = "plugwright-packages"
description = "Installed plugin packages on disk: digest, versioned staging with rollback, dev links and discovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["plugin", "package"]

[dependencies]
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
