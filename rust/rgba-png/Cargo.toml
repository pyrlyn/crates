[package]
name = "rgba-png"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "RGBA8 frames and PNG files: encode, decode with an allocation cap, per-pixel comparison with a threshold, diff images"
license = "Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
# Consumed by git rev (scull, slint-bindings); release-plz skips it.
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
png = "0.18.1"
