[package]
name = "shell-completions"
version = "0.1.1"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/pyrlyn/crates"
description = "Shared clap shell completion generation, including Clink"
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

[lints.rust]
unsafe_code = "forbid"
