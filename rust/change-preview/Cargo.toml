[package]
name = "change-preview"
version = "0.1.1"
edition = "2021"
rust-version = "1.86"
description = "Preview what a command would change: unified diff or --stat of file edits, size and file count of removals, and a totals line"
license.workspace = true
repository = "https://github.com/pyrlyn/crates"
keywords = ["dry-run", "diff", "preview", "cli"]
categories = ["command-line-interface", "text-processing"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
owo-colors = { version = "4.4", features = ["supports-colors"] }
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2"

[dev-dependencies]
serde_json = "1.0.151"
