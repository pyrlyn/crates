name: publish-crates

# Selective publishing with cargo-workspaces (pinned in mise.toml as `cargo:cargo-workspaces`).
#
# A crate is published when its `Cargo.toml` version is not on crates.io yet: a crate whose
# version was not bumped is skipped ("already published"), so an unchanged crate never goes
# out. A change is released by bumping the crate (`cargo ws version`, or by hand) in a pull
# request; merging that bump is what publishes it. Dependency order is cargo-workspaces' own
# and it waits for the registry index between dependent crates.
#
# - pull request: lists the crates changed against the base branch (`cargo ws changed`) and
#   runs `cargo ws publish --publish-as-is --dry-run`. Nothing is uploaded and no token is used.
# - push to main: the same listing against the previous main commit, then the publish. It is
#   real only when the repository variable CRATES_PUBLISH is `true` (the first runs are dry:
#   crates that never reached crates.io would all go out at once). CARGO_REGISTRY_TOKEN is
#   passed as an environment variable and never written to disk or printed.
# - workflow_dispatch: `dry-run: false` publishes for real regardless of the variable.
#   `crates` empty (the default) still publishes every crate whose version is not on
#   crates.io. `crates: text-sanitize` or `crates: text-sanitize,llm-testkit` is the
#   selective path: only those packages. A name that is not a workspace member fails
#   the step. cargo-workspaces 0.4.2 publish has no `--packages` / `-p` (`cargo ws
#   publish --help`); other members are set `publish = false` in this checkout, not
#   committed, so `cargo ws publish` skips them.
#
# No tags or releases are created here: bump.yml / release.yml stay the way to tag and release.
# `cargo ws changed` compares against the last git tag (or --since); the existing
# `<crate>-v<version>` tags predate most crates' content, so it is a report, not the gate.
on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - .github/workflows/publish-crates.yml
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - .github/workflows/publish-crates.yml
  workflow_dispatch:
    inputs:
      dry-run:
        description: only package and list what would be published
        default: true
        type: boolean
      crates:
        description: "comma-separated packages, e.g. text-sanitize or text-sanitize,llm-testkit; empty publishes every unpublished crate"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    # Draft pull requests skip the dry run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `cargo ws changed` diffs against another commit
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          # The cargo backend requires the configured rustc wrapper while installing tools.
          install_args: rust sccache cargo:cargo-workspaces
      - name: System libraries (speech-capture links ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Changed crates
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) since="origin/$BASE_REF" ;;
            push) since="$BEFORE" ;;
            *) since="" ;;
          esac
          {
            echo "### Crates changed since ${since:-the last tag}"
            echo '```'
            if [ -n "$since" ]; then cargo ws changed --since "$since"; else cargo ws changed; fi || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish (dry run unless enabled)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          EVENT: ${{ github.event_name }}
          VARIABLE: ${{ vars.CRATES_PUBLISH }}
          DISPATCH_DRY_RUN: ${{ inputs.dry-run }}
          CRATES: ${{ inputs.crates }}
        run: |
          set -euo pipefail
          real=0
          if [ "$EVENT" = push ] && [ "$VARIABLE" = true ]; then real=1; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_DRY_RUN" = false ]; then real=1; fi
          args=(--publish-as-is --allow-branch '*' --publish-interval 10)
          if [ "$real" = 1 ]; then
            if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
              echo "CARGO_REGISTRY_TOKEN is not set: a crates.io API token." >&2
              exit 1
            fi
            echo "::notice title=publish-crates::publishing crates whose version is not on crates.io"
          else
            # Without the dependencies on the registry a dependent crate cannot be verified.
            args+=(--dry-run --no-verify)
            echo "::notice title=publish-crates::dry run, nothing is uploaded"
          fi
          # 0.4.2 has no -p/--packages. Unnamed members become publish = false here.
          if [ -n "${CRATES//[[:space:]]/}" ]; then
            selected="$(python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          raw = os.environ["CRATES"]
          names = [part.strip() for part in raw.split(",")]
          if any(not part for part in names):
              sys.exit("error: empty crate name in crates list")
          seen = set()
          for name in names:
              if not re.fullmatch(r"[A-Za-z0-9_-]+", name):
                  sys.exit(f"error: '{name}' is not a crate name")
              if name in seen:
                  sys.exit(f"error: duplicate crate name '{name}'")
              seen.add(name)

          def metadata():
              out = subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"]
              )
              return json.loads(out)

          def members_of(meta):
              ids = set(meta["workspace_members"])
              found = {}
              for pkg in meta["packages"]:
                  if pkg["id"] not in ids:
                      continue
                  found.setdefault(pkg["name"], []).append(pkg)
              return found

          def public(pkg):
              listed = pkg.get("publish")
              return not (isinstance(listed, list) and len(listed) == 0)

          def section_name(line):
              text = line.strip()
              if not text.startswith("[") or not text.endswith("]") or text.startswith("[["):
                  return None
              return text[1:-1].strip().strip('"').strip("'")

          def privatize(path):
              lines = path.read_text().splitlines(keepends=True)
              headers = []
              for index, line in enumerate(lines):
                  name = section_name(line.rstrip("\r\n"))
                  if name is not None:
                      headers.append((index, name))
              ranges = [index for index, name in headers if name == "package"]
              if len(ranges) != 1:
                  sys.exit(f"error: {path} has {len(ranges)} [package] tables")
              which = ranges[0]
              start = headers[which][0]
              end = headers[which + 1][0] if which + 1 < len(headers) else len(lines)
              key = re.compile(r"^\s*publish(?:\.workspace)?\s*=")
              hits = []
              body_index = start + 1
              while body_index < end:
                  code = lines[body_index].split("#", 1)[0]
                  if key.match(code):
                      stop = body_index + 1
                      if "[" in code and "]" not in code:
                          while stop < end and "]" not in lines[stop].split("#", 1)[0]:
                              stop += 1
                          if stop < end:
                              stop += 1
                      hits.append((body_index, stop))
                      body_index = stop
                      continue
                  body_index += 1
              if len(hits) > 1:
                  sys.exit(f"error: {path} has more than one publish key")
              newline = "\r\n" if lines[start].endswith("\r\n") else "\n"
              if not hits:
                  lines.insert(start + 1, f"publish = false{newline}")
              else:
                  begin, stop = hits[0]
                  indent = re.match(r"\s*", lines[begin]).group(0)
                  if re.fullmatch(r"\s*publish\s*=\s*false\s*", lines[begin].split("#", 1)[0]):
                      return
                  lines[begin:stop] = [f"{indent}publish = false{newline}"]
              path.write_text("".join(lines))

          meta = metadata()
          members = members_of(meta)
          known = ", ".join(sorted(members))
          for name in names:
              hits = members.get(name, [])
              if len(hits) != 1:
                  sys.exit(f"error: {name} is not a workspace member (members: {known})")
              listed = hits[0].get("publish")
              if isinstance(listed, list) and "crates-io" not in listed:
                  sys.exit(
                      f"error: {name} is not publishable to crates.io"
                      " (publish = false or another registry)"
                  )
          wanted = set(names)
          for name, hits in members.items():
              if name in wanted or not public(hits[0]):
                  continue
              privatize(Path(hits[0]["manifest_path"]))
          again = members_of(metadata())
          still_public = sorted(name for name, hits in again.items() if public(hits[0]))
          if still_public != sorted(wanted):
              sys.exit(
                  "error: refusing to publish unnamed crates; public members would be "
                  + ", ".join(still_public)
              )
          print(",".join(names))
          PY
            )"
            echo "::notice title=publish-crates::publishing only ${selected}"
          fi
          cargo ws publish "${args[@]}"
