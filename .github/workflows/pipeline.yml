# Gated pipeline: pyrlyn/ci's config-driven ci.yml (configured in .github/infra.yml) runs
# CodeQL, Semgrep and actionlint behind `pipeline / gate`. Language CI stays in ci.yml.
# Draft pull requests skip every job, the gate included, until marked ready. Secrets are passed
# explicitly.
# Shared workflows: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    uses: pyrlyn/ci/.github/workflows/ci.yml@31612259553f8163e97d9fc7dbd2bf83b4f03ca2 # main
    # The union every nested job asks for, validated up front even for disabled checks.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
      issues: write # pyrlyn/ci main-failure job
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
