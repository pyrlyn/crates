# The only way to a release, and the only thing that creates a
# `<package>-v*` tag (pyrlyn/ci bump.yml). One run releases the one crate
# named by `package`. `release-plz update`
# (release-plz.toml) writes the next version and the CHANGELOG.md section from
# the conventional commits since the last tag; bump commits that as one
# `chore: release <package>-vX.Y.Z` commit, pushes it to a `release/bump-*`
# branch and opens a pull request into main with RELEASE_PLZ_TOKEN, so the
# pull request's own ci.yml runs. Once every required check is green, bump
# rebase-merges it with GITHUB_TOKEN, reads back the commit that landed on
# main, tags it, creates a draft release with the changelog section and
# dispatches release.yml on the tag (gate, crates.io, publish the draft). Red
# checks, a timeout or a failed merge close the pull request: no tag, no
# release. `dry-run` stops after the checks. `level` is not used: release-plz
# decides the next version from the commits. It versions every crate with
# unreleased commits; when both had some, the other one's version lands
# untagged, and its own run with `release-untagged-head` releases it.
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      package:
        description: the crate to release
        required: true
        type: choice
        options:
          - file-backup
          - change-preview
          - operation-icons
          - fs-kit
          - agent-ext
          - agent-host-config
          - agent-loop
          - config-schema
          - llm-catalog
          - llm-http
          - llm-wire
          - llm-wire-anthropic
          - llm-wire-openai
          - mcp-client-host
          - perm-rules
          - proc-sandbox
          - shell-classify
          - speech-capture
          - text-sanitize
          - wasm-plugin-host
          - telemetry-setup
          - gettext-catalog
          - sqlite-change-feed
          - abi-drift
          - keychain-secret
          - git-changed-paths
          - cargo-changed-packages
          - scoped-check
          - injecta-macros
          - injecta
          - sccache-r2
          - app-home
          - atomic-replace
      prerelease:
        description: "semver prerelease suffix, e.g. alpha.1 (empty: a normal release through release-plz)"
        default: ""
        type: string
      level:
        description: "prerelease only: how far past the last released version (a never-released crate keeps its version)"
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: open the version pull request and wait for its checks, then close it
        default: false
        type: boolean
      release-untagged-head:
        description: release the untagged version already on main (nothing to commit) as it stands
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/ci/.github/workflows/bump.yml@341896b491b89d93a1940313c0149ddfd8fae9c2 # main
    permissions:
      contents: write # the bump branch, the tag and the release
      pull-requests: write # merge or close the bump pull request
      actions: write # dispatch release.yml (and ci.yml for release-untagged-head)
      checks: read # wait for the required checks
      statuses: read
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      level: ${{ inputs.level }}
      # A prerelease goes through scripts/prerelease.sh (<version>-<suffix>; a
      # `-` version makes the GitHub Release a prerelease); otherwise release-plz.
      release-script: ${{ inputs.prerelease != '' && 'scripts/prerelease.sh' || '' }}
      release-script-args: ${{ inputs.prerelease }} ${{ inputs.package }}
      dry-run: ${{ inputs.dry-run }}
      release-untagged-head: ${{ inputs.release-untagged-head }}
      # Every GitHub Release is a dev snapshot, published as a prerelease. This
      # repository's decision, not pyrlyn/ci's. (crates.io gets the source as
      # before; there is no binary build profile here.)
      prerelease: true
      release-title-suffix: " (dev build)"
      release-notes-header: |-
        > [!WARNING]
        > Dev build: a development snapshot, published as a prerelease.
      release-plz-update: ${{ inputs.prerelease == '' }}
      package: ${{ inputs.package }}
      tag-prefix: ${{ inputs.package }}-v
      commit-message: "chore: release ${{ inputs.package }}-v{version}"
      mise: false # mise.toml pins lint tools only; rust-toolchain.toml pins Rust
      ci-workflows: ci.yml
      release-workflows: release.yml
    secrets:
      BUMP_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
