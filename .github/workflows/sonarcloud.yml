# SonarCloud analysis (+ Rust LCOV coverage) through pyrlyn/ci's sonarcloud.yml. Every
# step skips with a notice when SONAR_TOKEN is not set; coverage and scan are soft-fail.
# Rust comes from rust-toolchain.toml (mise.toml pins lint tools only).
name: sonarcloud

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarcloud:
    uses: pyrlyn/ci/.github/workflows/sonarcloud.yml@863d8960601216eec62d4aa78924f84ce61d72b9
    permissions:
      contents: read
      pull-requests: read
      actions: write # cancel-run on failure
    with:
      mise: false
      rust: true # llvm-tools-preview, cargo-llvm-cov
      coverage-command: cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
