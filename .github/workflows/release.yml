name: release

# The release build. It never tags and never starts itself: bump.yml
# (Actions -> Bump and release, pyrlyn/ci bump.yml) is the only way to a
# release and the only thing that creates a `<package>-v*` tag. bump runs
# `release-plz update`, opens a pull request with the one version commit,
# rebase-merges it once every required check is green, tags the commit that
# landed on main, creates a *draft* release with the CHANGELOG.md section and
# dispatches this workflow with `--ref <tag> -f tag=<tag>` (a tag pushed with
# GITHUB_TOKEN starts no workflow, so the dispatch is explicit).
#
# Here: the gate again on the tagged commit, crates.io, then the draft is
# published. The tag names the crate (`<crate>-v<version>`): any workspace crate
# that is not `publish = false`, whose workspace dependencies are already on
# crates.io. A failed run leaves the tag and a draft; re-run it with the same
# tag (an "already published" crate is accepted on a re-run, and so is a
# crates.io rate limit once its window has passed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag bump.yml created (<package>-vX.Y.Z); run with --ref <tag>"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One release at a time; cancelling a run halfway could leave a draft behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The run must be on the tag bump created, and the tag must name a releasable
  # workspace crate and the version in its `Cargo.toml`.
  version:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.decide.outputs.package }}
      version: ${{ steps.decide.outputs.version }}
      changelog: ${{ steps.decide.outputs.changelog }}
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this run on the release tag?
        id: decide
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^([A-Za-z0-9_-]+)-v([0-9][0-9A-Za-z.+-]*)$ ]]; then
            echo "tag $TAG is not <crate>-v<version>" >&2
            exit 1
          fi
          package="${BASH_REMATCH[1]}"
          # Rejects a crate that is not a workspace member, has publish = false,
          # a version that is not in its Cargo.toml, or a dependency that is not
          # on crates.io yet.
          .github/scripts/release-crate.sh "$package" "${BASH_REMATCH[2]}" > "$RUNNER_TEMP/crate.env"
          cat "$RUNNER_TEMP/crate.env"
          version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/crate.env")"
          changelog="$(sed -n 's/^changelog=//p' "$RUNNER_TEMP/crate.env")"
          ref="$(git ls-remote origin "refs/tags/${TAG}^{commit}" | awk '{print $1; exit}')"
          [ -n "$ref" ] || ref="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1; exit}')"
          if [ "$ref" != "$GITHUB_SHA" ]; then
            echo "$TAG is ${ref:-missing}, this run is $GITHUB_SHA: dispatch with --ref $TAG" >&2
            exit 1
          fi
          {
            echo "package=$package"
            echo "version=$version"
            echo "changelog=$changelog"
            echo "tag=$TAG"
            echo "ref=$ref"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  # Nothing is published unless the same gate CI applies is green. A release is
  # the one build people cannot re-run themselves. pyrlyn/ci ci-rust.yml, the
  # workflow ci.yml calls, on the tagged commit (this run is on the tag, see
  # `version`): fmt, then clippy -D warnings, check and the tests with --locked.
  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@main # same pin as ci.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure
    with:
      # The release gate ran on Linux only; ci.yml covers the other targets.
      matrix: '[{"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"}]'
      # Rust comes from mise.toml, as in ci.yml.
      feature-args: ""
      clippy-args: --locked
      # speech-capture links ALSA through cpal's alsa-sys on Linux; ci.yml installs it too, and
      # the Wasm target plugwright's tests build plugins for.
      setup-command: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
        rustup target add wasm32-unknown-unknown
      # `cargo test --workspace` already runs the doctests.
      test-command: cargo test --workspace --locked
      doc-tests: false

  # crates.io first: the tag and the GitHub release are the record of a
  # completed publish, not a promise of one.
  crates-io:
    needs: [version, verify]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: Swatinem/rust-cache@v2
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE: ${{ needs.version.outputs.package }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set: a crates.io API token." >&2
            exit 1
          fi
          set +e
          # cargo publish needs the registry credentials as a real config file:
          # the env var alone authenticates `cargo login`, not `cargo publish`.
          mkdir -p "$HOME/.cargo"
          printf '[registry]\ntoken = "%s"\n' "$CARGO_REGISTRY_TOKEN" > "$HOME/.cargo/credentials.toml"
          cargo publish -p "$PACKAGE" --locked > publish.log 2>&1
          status=$?
          set -e
          cat publish.log
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && grep -qE "already (published|exists)" publish.log; then
            echo "already on crates.io; continuing"
            exit 0
          fi
          exit $status

  publish:
    needs: [version, verify, crates-io]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          : > notes.md
          .github/scripts/changelog-section.sh "$VERSION" < "$CHANGELOG" > notes.md || true
          echo "notes: $(wc -c < notes.md) bytes"
          # bump.yml created the draft (with the crate's changelog notes) on the tag.
          gh release view "$TAG" --json tagName >/dev/null \
            || { echo "no release $TAG: start releases with bump.yml" >&2; exit 1; }
          if [ -s notes.md ] && [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft --jq '"published \(.tagName) draft=\(.isDraft)"'

  # A failed release opens (or comments on) a `release-failure` issue that mentions and assigns
  # the maintainer (pyrlyn/ci notify-release-failure.yml). always(): ci-rust cancels the rest
  # of the run after a failure, and this job must run anyway.
  notify-failure:
    needs: [version, verify, crates-io, publish]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      actions: read # failed job names
      issues: write
    uses: pyrlyn/ci/.github/workflows/notify-release-failure.yml@main # main 2026-10-07
    with:
      ref: ${{ needs.version.outputs.tag || inputs.tag }}
      needs: ${{ toJSON(needs) }}
