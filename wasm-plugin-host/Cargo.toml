[package]
name = "wasm-plugin-host"
version = "0.1.0"
edition = "2024"
# cox's MSRV, the lowest of its consumers (cox 1.98, scull 1.99).
rust-version = "1.98"
description = "Run WebAssembly plugins with extism: one worker thread per plugin, a memory cap, per-call deadlines and a control lane served before events"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates-packages"
keywords = ["wasm", "plugin", "extism", "sandbox"]
categories = ["wasm", "development-tools"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
# `wasmtime-exceptions` turns on the Wasm exception-handling proposal: Kotlin/Wasm
# output uses it unconditionally and does not parse without it. One engine
# configuration for every consumer, so a plugin built for one loads in another.
extism = { version = "1.30.0", default-features = false, features = ["wasmtime-exceptions"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
# extism 1.30.0 does not build with its default features off: it relies on
# wasmtime 43's `anyhow` feature, which only its `wasmtime-default-features`
# turns on. This enables that one feature by feature unification. It must stay
# on extism's wasmtime major, or a second wasmtime resolves that extism never sees.
wasmtime = { version = "43", default-features = false, features = ["anyhow"] }

[dev-dependencies]
tempfile = "3"
