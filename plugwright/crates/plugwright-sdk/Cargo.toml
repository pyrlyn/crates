[package]
name = "plugwright-sdk"
description = "Write plugwright plugins once, build them as native cdylib or Wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["macros"]
# `#[plugin]` and the serde-based argument encoding it relies on.
macros = ["dep:plugwright-macros", "dep:serde", "dep:serde_json"]

[dependencies]
plugwright-abi.workspace = true
plugwright-macros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
