[package]
name = "gettext-catalog"
version = "0.1.0"
edition = "2024"
# cox's MSRV, the lowest of its consumers (cox 1.98, Mailune 1.99).
rust-version = "1.98"
description = "gettext .po catalogs for an application's own strings: Plural-Forms rules, named placeholders, language negotiation and per-message fallback, in pure Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pyrlyn/crates"
keywords = ["gettext", "i18n", "po", "localization", "plural"]
categories = ["internationalization", "localization"]
# The member's plan and agent files are repository bookkeeping, not part of the published crate.
include = ["/src", "/tests", "/README.md"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

# Versions are the ones cox locks, so adopting the crate moves neither lock file.
[dependencies]
polib = "0.3.0"
sys-locale = "0.3.2"
thiserror = "2.0.21"
unic-langid = "0.9.6"
