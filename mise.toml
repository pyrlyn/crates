# Rust is pinned here (CI installs it from this file); lint tools below serve the pre-push hook.
[tools]
# Same pin as rust-toolchain.toml; CI installs Rust from here. rust-src makes rustc quote
# std's source in diagnostics, so trybuild's expected stderr is the same on every machine.
rust = { version = "1.99.0", profile = "minimal", components = "rustfmt,clippy,rust-src" }
"cargo:cargo-workspaces" = "0.4.2"
"github:jdx/jactionlint" = "2.0.2" # the pre-push hook and `mise x -- jactionlint`; the local mise registry lacks the short name
hk = "2.5.0" # runs jactionlint as a pre-push hook (hk.pkl); `mise x -- hk install --mise`
shellcheck = "0.11.0" # used by jactionlint for run: scripts; the global mise shim has no version without a pin
